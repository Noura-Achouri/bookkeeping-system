{% load lang_tags i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BookKeeper{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12/dist/gsap.min.js"></script>
    <script>
        (function() {
            const saved = localStorage.getItem('bookkeeper-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif; }
        :root { --radius: 20px; --transition: all 0.25s ease; --bg-particles: 0, 255, 65; }
        [data-theme="light"] { --bg-particles: 14, 165, 233; }
        [data-theme="dark"] {
            --bg: #050805;
            --bg-glow: radial-gradient(circle at 20% 30%, rgba(0,255,65,0.12) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(0,255,65,0.08) 0%, transparent 35%);
            --surface: rgba(10, 17, 12, 0.85);
            --border: rgba(0, 255, 65, 0.25);
            --primary: #00FF41;
            --primary-dim: #00C936;
            --primary-glow: rgba(0, 255, 65, 0.35);
            --text: #F0FFF2;
            --text-muted: #A0B0A3;
            --danger: #FF2B4F;
            --shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        [data-theme="light"] {
            --bg: #F0F9FF;
            --bg-glow: radial-gradient(circle at 20% 30%, rgba(14,165,233,0.12) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(14,165,233,0.08) 0%, transparent 35%);
            --surface: rgba(255, 255, 255, 0.92);
            --border: rgba(14, 165, 233, 0.25);
            --primary: #0EA5E9;
            --primary-dim: #0284C7;
            --primary-glow: rgba(14, 165, 233, 0.25);
            --text: #0F172A;
            --text-muted: #64748B;
            --danger: #EF4444;
            --shadow: 0 20px 60px rgba(15,23,42,0.1);
        }
        body {
            min-height: 100vh;
            background: var(--bg-glow), var(--bg);
            background-attachment: fixed;
            display: flex; align-items: center; justify-content: center;
            padding: 40px 20px;
            color: var(--text);
            transition: background 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        /* Shared animated background layers */
        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.55;
        }
        [data-theme="light"] #bg-canvas { opacity: 0.7; }
        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            animation: orbFloat 18s ease-in-out infinite;
        }
        [data-theme="dark"] .bg-orb { background: rgba(0, 255, 65, 0.4); }
        [data-theme="light"] .bg-orb { background: rgba(14, 165, 233, 0.4); }
        .bg-orb.o1 { width: 500px; height: 500px; top: -10%; left: -8%; animation-delay: 0s; }
        .bg-orb.o2 { width: 420px; height: 420px; bottom: -12%; right: -6%; animation-delay: -6s; }
        .bg-orb.o3 { width: 360px; height: 360px; top: 40%; left: 55%; animation-delay: -12s; }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, -30px) scale(1.05); }
            66% { transform: translate(-30px, 40px) scale(0.95); }
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.35;
            mask-image: radial-gradient(circle at center, black 0%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 80%);
        }

        .auth-card {
            width: 100%; max-width: 400px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 42px 34px;
            box-shadow: var(--shadow), 0 0 40px var(--primary-glow);
            backdrop-filter: blur(14px);
            text-align: center;
            transition: var(--transition);
        }
        .auth-card:hover { box-shadow: var(--shadow), 0 0 60px var(--primary-glow); }
        .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 28px; }
        .brand-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), var(--primary-dim)); display: grid; place-items: center; color: #000; font-weight: 900; }
        [data-theme="light"] .brand-icon { color: #fff; }
        img.brand-icon { object-fit: cover; background: transparent !important; display: block; }
        .brand-text { font-size: 1.3rem; font-weight: 800; color: var(--text); }
        h1 { font-size: 2rem; margin-bottom: 26px; color: var(--primary); text-shadow: 0 0 20px var(--primary-glow); }
        input {
            width: 100%; padding: 14px 18px; margin: 10px 0;
            background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 12px;
            color: var(--text); font-size: 1rem; outline: none; transition: var(--transition);
        }
        [data-theme="light"] input { background: rgba(255,255,255,0.6); }
        input:focus { border-color: var(--primary); box-shadow: 0 0 16px var(--primary-glow); }
        input::placeholder { color: var(--text-muted); }
        button[type="submit"] {
            width: 100%; padding: 15px; margin-top: 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dim)); border: none; border-radius: 12px;
            color: #000; font-weight: 800; font-size: 1.05rem; cursor: pointer; transition: var(--transition);
            box-shadow: 0 4px 20px var(--primary-glow);
        }
        [data-theme="light"] button[type="submit"] { color: #fff; }
        button[type="submit"]:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--primary-glow); }
        .auth-link { display: block; margin-top: 22px; color: var(--text-muted); text-decoration: none; transition: var(--transition); }
        .auth-link:hover { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }
        .error-msg { margin-bottom: 16px; padding: 12px; background: rgba(255,43,79,0.12); border: 1px solid var(--danger); border-radius: 12px; color: var(--danger); font-size: 0.92rem; }
        .top-controls {
            position: fixed; top: 20px; right: 20px;
            display: flex; gap: 12px; align-items: center;
        }
        .theme-toggle {
            width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border);
            background: var(--surface); color: var(--text); display: grid; place-items: center; cursor: pointer; transition: var(--transition);
        }
        .theme-toggle:hover { border-color: var(--primary); box-shadow: 0 0 16px var(--primary-glow); }
        .lang-select {
            padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text); font-weight: 600; font-size: 0.85rem; cursor: pointer;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <div class="bg-orbs" aria-hidden="true">
        <div class="bg-orb o1"></div>
        <div class="bg-orb o2"></div>
        <div class="bg-orb o3"></div>
    </div>

    <div class="top-controls">
        <form action="{% url 'set_language' %}" method="post" style="margin:0;">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.path }}">
            <select name="language" class="lang-select" onchange="this.form.submit()">
                {% get_current_language as current_language %}
                {% get_available_languages as available_languages %}
                {% for lang_code, lang_name in available_languages %}
                    <option value="{{ lang_code }}" {% if lang_code == current_language %}selected{% endif %}>{{ lang_name }}</option>
                {% endfor %}
            </select>
        </form>
        <button class="theme-toggle" id="themeToggle" aria-label="{% lang_text 'toggle_theme' %}"><span id="themeIcon">☀</span></button>
    </div>

    {% block content %}{% endblock %}

    <script>
        (function() {
            const toggle = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const html = document.documentElement;
            function updateIcon() { icon.textContent = html.getAttribute('data-theme') === 'dark' ? '☀' : '☾'; }
            updateIcon();
            toggle.addEventListener('click', () => {
                const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', next); localStorage.setItem('bookkeeper-theme', next); updateIcon();
            });

            // Animated particle background
            (function initParticles() {
                const canvas = document.getElementById('bg-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let width = canvas.width = window.innerWidth;
                let height = canvas.height = window.innerHeight;

                function parseRGB(value) {
                    if (!value) return [0, 255, 65];
                    return value.split(',').map(n => parseInt(n.trim(), 10));
                }
                function color() {
                    const [r, g, b] = parseRGB(getComputedStyle(document.documentElement).getPropertyValue('--bg-particles'));
                    return { r, g, b };
                }

                const COUNT = Math.min(100, Math.floor((width * height) / 16000));
                const particles = [];
                for (let i = 0; i < COUNT; i++) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.4,
                        vy: (Math.random() - 0.5) * 0.4,
                        r: Math.random() * 1.6 + 0.6
                    });
                }

                window.addEventListener('resize', () => {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                });

                function tick() {
                    const { r, g, b } = color();
                    ctx.clearRect(0, 0, width, height);
                    for (let i = 0; i < particles.length; i++) {
                        const p = particles[i];
                        for (let j = i + 1; j < particles.length; j++) {
                            const q = particles[j];
                            const dx = p.x - q.x, dy = p.y - q.y;
                            const d2 = dx * dx + dy * dy;
                            if (d2 < 12000) {
                                const alpha = 1 - d2 / 12000;
                                ctx.strokeStyle = `rgba(${r},${g},${b},${alpha * 0.18})`;
                                ctx.lineWidth = 0.5;
                                ctx.beginPath();
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(q.x, q.y);
                                ctx.stroke();
                            }
                        }
                    }
                    for (const p of particles) {
                        p.x += p.vx; p.y += p.vy;
                        if (p.x < 0 || p.x > width) p.vx *= -1;
                        if (p.y < 0 || p.y > height) p.vy *= -1;
                        ctx.fillStyle = `rgba(${r},${g},${b},0.55)`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    requestAnimationFrame(tick);
                }
                tick();
            })();
        })();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
