{% load static %}
<style>
    /* Shared Top Navbar */
    .main-nav {
        position: sticky;
        top: 0;
        z-index: 10;
        width: 100%;
        backdrop-filter: blur(16px);
        background: rgba(18, 20, 32, 0.9);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        padding: 18px 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 30px;
        overflow: visible;
    }

    .nav-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        flex-shrink: 0;
    }
    .nav-logo-icon {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 900;
        box-shadow: 0 0 14px rgba(0,164,230,0.45);
    }
    img.nav-logo-icon { object-fit: cover; background: transparent !important; }
    .nav-logo-text {
        font-size: 1.3rem;
        font-weight: 800;
        color: #fff;
        letter-spacing: 0.4px;
    }

    .nav-links {
        display: flex;
        gap: 34px;
        align-items: center;
        margin-left: 20px;
        margin-right: auto;
    }
    .nav-link {
        color: var(--text-gray);
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 500;
        padding: 10px 18px;
        border-radius: 10px;
        transition: all 0.3s ease;
        position: relative;
        white-space: nowrap;
    }
    .nav-link:hover {
        color: #fff;
        background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
        box-shadow: 0 0 18px rgba(0,164,230,0.35);
    }
    .nav-link.active {
        color: #fff;
    }
    .nav-link.active:hover {
        background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
        box-shadow: 0 0 18px rgba(0,164,230,0.35);
    }

    .nav-actions {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-shrink: 0;
    }
    .nav-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 22px;
        background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.92rem;
        border-radius: 10px;
        border: none;
        overflow: hidden;
        transition: all 0.3s ease;
        cursor: pointer;
        white-space: nowrap;
    }
    .nav-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
        animation: sweepGlow 3.2s infinite linear;
    }
    @keyframes sweepGlow {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }
    .nav-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 20px rgba(0,164,230,0.4);
    }
    .nav-btn-outline {
        background: transparent;
        color: #fff;
        border: 1.5px solid rgba(255,255,255,0.25);
        box-shadow: none;
    }
    .nav-btn-outline::before {
        display: none;
    }
    .nav-btn-outline:hover {
        border-color: var(--primary-blue);
        color: var(--primary-blue);
        box-shadow: 0 0 15px rgba(0,164,230,0.25);
    }
</style>

<nav class="main-nav">
    <a href="{% url 'dashboard' %}" class="nav-logo">
        <img src="{% static 'images/logo.png' %}" alt="BookKeeper" class="nav-logo-icon">
        <span class="nav-logo-text">BookKeeper</span>
    </a>

    <div class="nav-links">
        <a href="{% url 'dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="{% url 'records' %}" class="nav-link {% if request.resolver_match.url_name == 'records' %}active{% endif %}">Records</a>
        <a href="{% url 'category_list' %}" class="nav-link {% if request.resolver_match.url_name == 'category_list' %}active{% endif %}">Categories</a>
        <a href="{% url 'reports' %}" class="nav-link {% if request.resolver_match.url_name == 'reports' %}active{% endif %}">Reports</a>
    </div>

    <div class="nav-actions">
        <a href="{% url 'add_category' %}" class="nav-btn nav-btn-outline">+ Add Category</a>
        <a href="{% url 'add_record' %}" class="nav-btn">+ Add New Record</a>
    </div>
</nav>
